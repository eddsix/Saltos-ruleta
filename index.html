<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090d12">
  <title>European Roulette · Jumps</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">EUROPEAN ROULETTE</div>
        <h1>Jump Tracker</h1>
      </div>
      <div class="actions">
        <button id="undoResult" class="action-btn" type="button">Deshacer</button>
        <button id="clearHistory" class="clear-btn" type="button">Borrar historial</button>
      </div>
    </header>

    <main>
      <section class="panel result-panel">
        <div class="panel-heading">
          <div>
            <span class="panel-kicker">01</span>
            <h2>Resultado</h2>
          </div>
          <span id="resultCount" class="counter">0 resultados</span>
        </div>

        <div id="resultHistory" class="result-history empty">
          <span>Selecciona el número que acaba de salir</span>
        </div>

        <div id="numberGrid" class="number-grid" aria-label="Números de la ruleta europea"></div>
      </section>

      <section class="panel jumps-panel">
        <div class="panel-heading">
          <div>
            <span class="panel-kicker">02</span>
            <h2>Saltos</h2>
          </div>
          <span id="jumpCount" class="counter">0 saltos</span>
        </div>
        <div id="jumpHistory" class="jump-history empty">
          <span>Los saltos aparecerán aquí</span>
        </div>
      </section>

      <section class="panel detected-panel">
        <div class="panel-heading">
          <div>
            <span class="panel-kicker">03</span>
            <h2>Saltos detectados</h2>
          </div>
          <span class="legend"><i></i> Detectado</span>
        </div>
        <div id="detectedGrid" class="detected-grid"></div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
